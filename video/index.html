<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NK Video Name Builder</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#F0F0F2; --panel:#FFFFFF; --panel-2:#F7F7F8; --ink:#0B0D12; --muted:#5F6068; --line:#D5D5D7; --gold:#B3985F;
    --accent:#C12F27; --accent-ink:#FFFFFF; --accent-soft:#F8E3E1; --ok:#1E7F4F; --ok-soft:#E1F3E9; --warn:#9A6400; --warn-soft:#FFF3D6; --bad:#B42318; --bad-soft:#FBE4E1;
    --g1:#3B5BDB; --g2:#0B7285; --g3:#5F3DC4; --g4:#C92A2A; --g5:#862E9C; --g6:#087F5B;
    --display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif; --body:"Poppins",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ground:#0B0D12; --panel:#15181F; --panel-2:#1C2028; --ink:#F0F0F2; --muted:#9A9CA6; --line:#2A2E38; --gold:#C7B48B;
    --accent:#D53631; --accent-ink:#FFFFFF; --accent-soft:#3A1615; --ok:#5CCB8A; --ok-soft:#173224; --warn:#F2C14E; --warn-soft:#3A2F0F; --bad:#F87171; --bad-soft:#3B1A18;
    --g1:#8DA2FF; --g2:#5FD3E8; --g3:#B39DFF; --g4:#FF8787; --g5:#DA9BF0; --g6:#5FD1A8;
  }}
  :root[data-theme="dark"]{
    --ground:#0B0D12; --panel:#15181F; --panel-2:#1C2028; --ink:#F0F0F2; --muted:#9A9CA6; --line:#2A2E38; --gold:#C7B48B;
    --accent:#D53631; --accent-ink:#FFFFFF; --accent-soft:#3A1615; --ok:#5CCB8A; --ok-soft:#173224; --warn:#F2C14E; --warn-soft:#3A2F0F; --bad:#F87171; --bad-soft:#3B1A18;
    --g1:#8DA2FF; --g2:#5FD3E8; --g3:#B39DFF; --g4:#FF8787; --g5:#DA9BF0; --g6:#5FD1A8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--body)}
  body.figma{font-size:12.5px}
  .app{max-width:1220px;margin:0 auto;padding:20px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
  body.figma .app{grid-template-columns:1fr;padding:12px 12px 40px;gap:12px}
  @media (max-width:900px){ .app{grid-template-columns:1fr} }
  header{grid-column:1 / -1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font:400 34px/1 var(--display);letter-spacing:.04em;margin:0;text-transform:uppercase}
  header h1 b{color:var(--accent);font-weight:400}
  body.figma header h1{font-size:26px}
  header .chip{font:500 10px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:2px;padding:5px 8px}
  header .sub{flex-basis:100%;color:var(--muted);margin:0;max-width:72ch}
  .tabs{grid-column:1 / -1;display:flex;gap:6px}
  .tabs button{font:400 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:10px 18px;border-radius:3px 3px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--panel-2);color:var(--muted)}
  .tabs button.on{background:var(--panel);color:var(--accent);border-color:var(--accent)}
  .out{position:sticky;top:12px;display:grid;gap:10px}
  body.figma .out{order:-1;grid-column:1 / -1;top:0;background:var(--ground);padding-bottom:6px;z-index:2;gap:6px}
  body.figma .out .meta{font-size:11px} body.figma .out button{padding:8px 10px;font-size:12px}
  body.figma .below{display:grid;gap:8px}
  .name{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;font:12.5px/1.75 var(--mono);word-break:break-all;min-height:96px}
  body.figma .name{font:10.5px/1.5 var(--mono);min-height:0;max-height:66px;overflow:auto;padding:8px 10px}
  .ratios{display:grid;gap:8px} .rbox{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .rbox .rl{font:400 18px/1 var(--display);letter-spacing:.06em;color:var(--gold)} .rbox .rn{font:11px/1.5 var(--mono);word-break:break-all;color:var(--muted)} .rbox button{padding:8px 10px;font-size:12px;white-space:nowrap}
  .name .tok{border-radius:3px;padding:0 2px;cursor:help}
  .name .sep{color:var(--muted)}
  .name .tok:hover{outline:1px solid currentColor}
  .tok.g-who{color:var(--g1)} .tok.g-brief{color:var(--g2)} .tok.g-message{color:var(--g3)} .tok.g-visual,.tok.g-production{color:var(--g6)} .tok.g-origin{color:var(--g5)} .tok.g-ratio,.tok.g-fixed{color:var(--muted)}
  .tok.k-concept{color:var(--ink);font-weight:500} .tok.k-format{color:var(--accent);font-weight:500} .tok.k-avatar{color:var(--gold);font-weight:500} .tok.k-id{font-weight:500}
  .tok.missing{background:var(--bad-soft);color:var(--bad);font-weight:500}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font:500 13px/1 var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:3px;padding:10px 14px;cursor:pointer}
  button:hover{border-color:var(--ink)} button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.primary:hover{filter:brightness(.95)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msgs{display:grid;gap:6px}
  .msg{border-radius:3px;padding:8px 10px;font-size:12.5px}
  .msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.warn{background:var(--warn-soft);color:var(--warn)} .msg.bad{background:var(--bad-soft);color:var(--bad)}
  .sel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:12.5px;display:grid;gap:4px}
  .sel .row{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px}
  .sel .row span:last-child{color:var(--muted);white-space:nowrap}
  form{display:grid;gap:14px;margin:0}
  fieldset{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:12px 14px 14px;margin:0;display:grid;gap:10px}
  legend{font:400 16px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);padding:0 6px;display:flex;gap:8px;align-items:center}
  legend .n{font:500 10px/1 var(--mono);letter-spacing:0;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  body.figma .grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  label.f{display:grid;gap:4px;min-width:0;align-content:start}
  label.f.wide{grid-column:1 / -1}
  label.f>span.l{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
  label.f>span.l em{font-style:normal;color:var(--accent);letter-spacing:0;text-transform:none;font-weight:500}
  select,input[type=text],input[type=date],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:8px 9px;min-width:0}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  select.empty{color:var(--bad);border-color:var(--bad)}
  .hint{color:var(--muted);font-size:11.5px;line-height:1.35;min-height:15px}
  .fmt{display:grid;gap:8px}
  .fmt .desc{display:flex;gap:8px;align-items:baseline;font-size:12.5px;min-height:18px}
  .fmt .desc b{font-family:var(--mono);font-weight:500;color:var(--accent)}
  textarea{font:11.5px/1.5 var(--mono);resize:vertical;min-height:52px}
  .idrow{display:flex;gap:6px;align-items:center}
  .idrow input{flex:1}
  .idrow button{padding:8px 10px;font-size:12px}
  details.legend{grid-column:1 / -1;color:var(--muted);font-size:12.5px}
  details.legend summary{cursor:pointer;font-weight:600;color:var(--ink)}
  details.legend table{border-collapse:collapse;width:100%;margin-top:8px}
  details.legend td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:top}
  details.legend td:first-child{font-family:var(--mono);white-space:nowrap;color:var(--ink)}
  .hidden{display:none !important}
</style>

<div class="app" id="app">
  <header>
    <h1>Northern<b>Knife</b> Name Builder</h1>
    <span class="chip" id="verchip">v2</span>
    <span class="chip" id="modechip"></span>
    <p class="sub" id="subline">Every field is a menu. The name builds itself as you pick. Only the concept is typed. Red = still to pick.</p>
  </header>
  <div class="tabs" id="tabs"><button type="button" data-mode="static" class="on">Static</button><button type="button" data-mode="video">Video</button></div>

  <form id="form" autocomplete="off" onsubmit="return false"></form>

  <aside class="out">
    <div class="name" id="name"></div>
    <div class="meta"><span id="fieldcount"></span><span id="charcount"></span></div>
    <div class="ratios" id="ratios"></div>
    <div class="btns">
      <button type="button" class="primary" id="applybtn">Apply to selected frames</button>
      <button type="button" id="copybtn">Copy both</button>
      <button type="button" id="rescanbtn" title="Re-read the frame names on this page">Rescan page</button>
      <button type="button" id="resetbtn" title="Clear everything except what is remembered">Reset</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="sel" id="selbox"></div>
    <div class="fmt">
      <textarea id="paste" placeholder="Paste an old or new name here. The menus fill themselves; old names are translated where they can be."></textarea>
    </div>
  </aside>
</div>

<script>
// NK static ad naming convention v2 - single source of truth for every dropdown.
// Edit HERE, then run `python3 build.py` to regenerate ui.html (Figma) and web/index.html.
// Rules: no `/ : ? * " < > | _` inside any value (they break Figma export + the underscore split).
// Every value is unique across ALL fields so a name can be parsed by token, not by position.
// To add a field: one entry in `fields` (kind "select" + a `list` name) and the list below. The form builds itself.

const NK_VOCAB = {
  convention: "2.2 (2026-09-19)",
  delimiter: "_",

  // Field order = the name. Never reorder without bumping `convention`.
  // group = which box of the form it sits in. list = the option list below (for kind "select").
  // remember = pre-selected next time (per designer machine).
  fields: [
    // --- who & what ---
    { key: "id",        group: "Who & what",  label: "Creative ID",     kind: "id",     help: "Designer prefix + 3 digits. Auto next number on this page. Never reuse an ID." },
    { key: "type",      group: "Who & what",  label: "Asset type",      kind: "select", list: "type",      help: "IMG = static. GIF = animated static.", remember: true },
    { key: "date",      group: "Who & what",  label: "Date",            kind: "date",   help: "MM.DD.YY, the day the frame is finished." },
    { key: "concept",   group: "Who & what",  label: "Concept",         kind: "text",   help: "Short human title, max 30 chars. Illegal characters are stripped automatically.", wide: true },
    { key: "version",   group: "Who & what",  label: "Version",         kind: "select", list: "version",   help: "V1 = first cut of this concept. V2+ = a re-skin of the same concept." },
    { key: "strategist",group: "Who & what",  label: "Strategist",      kind: "select", list: "strategist",help: "Who briefed the idea.", remember: true },
    { key: "designer",  group: "Who & what",  label: "Designer",        kind: "select", list: "designer",  help: "Who built the file. Sets the ID prefix.", remember: true },
    // --- brief ---
    { key: "market",    group: "Brief",       label: "Market",          kind: "select", list: "market",    help: "Which store it is built for. Mkt-All when it ships to every store unchanged.", remember: true },
    { key: "event",     group: "Brief",       label: "Event / season",  kind: "select", list: "event",     help: "What moment the ad is built for. Evergreen when none.", remember: true },
    { key: "product",   group: "Brief",       label: "Product",         kind: "select", list: "product",   help: "Hero product. Multi when 2+ knives share the frame.", remember: true },
    { key: "avatar",    group: "Brief",       label: "Avatar",          kind: "select", list: "avatar",    help: "Who the ad talks to. Always ONE named avatar. There is no 'everyone'.", remember: true },
    { key: "funnel",    group: "Brief",       label: "Funnel role",     kind: "select", list: "funnel",    help: "Top of funnel finds new people (First Click). Middle warms them. Bottom closes people who already know us.", remember: true },
    { key: "lp",        group: "Brief",       label: "Landing page",    kind: "select", list: "lp",        help: "Where the click goes (Ridge: destination).", remember: true },
    // --- message ---
    { key: "angle",     group: "Message",     label: "Messaging angle", kind: "select", list: "angle",     help: "What the ad argues. One angle per ad (Ridge: angle identifier; Motion: messaging angle)." },
    { key: "hook",      group: "Message",     label: "Hook tactic",     kind: "select", list: "hook",      help: "How the headline grabs, not the words (Motion: hook tactic)." },
    { key: "tone",      group: "Message",     label: "Tone",            kind: "select", list: "tone",      help: "The voice of the copy." },
    { key: "offer",     group: "Message",     label: "Offer shown",     kind: "select", list: "offer",     help: "The offer visible IN the ad, not the offer live on site.", remember: true },
    { key: "offerRole", group: "Message",     label: "Offer placement", kind: "select", list: "offerRole", help: "Where the offer sits. House rule: it resolves the subject, it never IS the headline." },
    { key: "price",     group: "Message",     label: "Price shown",     kind: "select", list: "price",     help: "Is a price or a compared-at price visible?" },
    { key: "proof",     group: "Message",     label: "Proof element",   kind: "select", list: "proof",     help: "Which trust device is on the canvas." },
    { key: "copyLen",   group: "Message",     label: "Copy length",     kind: "select", list: "copyLen",   help: "Total words on the canvas." },
    { key: "copyBy",    group: "Message",     label: "Copy written by", kind: "select", list: "copyBy",    help: "Who wrote the words on the ad." },
    // --- visual ---
    { key: "format",    group: "Visual",      label: "Visual format",   kind: "format", help: "The device the ad borrows. Pick from the Notion menu; ask before inventing a new one.", wide: true },
    { key: "media",     group: "Visual",      label: "Image origin",    kind: "select", list: "media",     help: "How the main visual was made." },
    { key: "text",      group: "Visual",      label: "Text weight",     kind: "select", list: "text",      help: "How much of the ad is words." },
    { key: "compare",   group: "Visual",      label: "Comparison",      kind: "select", list: "compare",   help: "Does the ad put two things side by side, and which kind?" },
    { key: "shot",      group: "Visual",      label: "Product shot",    kind: "select", list: "shot",      help: "How the knife appears (Nectar tracked product orientation the same way)." },
    { key: "human",     group: "Visual",      label: "Person on image",  kind: "select", list: "human",     help: "Is there a person, and are they happy or reacting?" },
    { key: "palette",   group: "Visual",      label: "Palette",         kind: "select", list: "palette",   help: "Overall ground of the frame (Ridge: colorway)." },
    { key: "fidelity",  group: "Visual",      label: "Fidelity",        kind: "select", list: "fidelity",  help: "Polished brand look vs deliberately rough / native (HexClad: hi-fi vs lo-fi)." },
    // --- origin ---
    { key: "category",  group: "Origin",      label: "Category",        kind: "select", list: "category",  help: "New = net-new idea. Ite = iteration of our own ad. Adapt = adapted from another brand's ad." },
    { key: "source",    group: "Origin",      label: "Adapted from",    kind: "source", help: "Only when Category is Adapt: the brand the mechanic came from. Src-None otherwise." },
    // --- tail ---
    { key: "ratio",     group: "Ratio",       label: "Ratio",           kind: "ratio",  help: "Read from the frame size in Figma. 1x1, 4x5 or 9x16." },
  ],

  // Option lists. A plain string is the value; {v, d} shows "v - d" in the menu, only v goes in the name.
  type: ["IMG", "GIF"],
  version: ["V1", "V2", "V3", "V4", "V5", "V6", "V7", "V8", "V9"],
  strategist: ["Andy", "Mark", "Claude", "Mauro", "Callum", "Kel", "Zyrille", "Nazmul"],
  // Designer -> ID prefix. Add new designers here.
  designer: [
    { v: "Kel",      prefix: "K" },
    { v: "Zyrille",  prefix: "Z" },
    { v: "Nazmul",   prefix: "N" },
    { v: "Udi",      prefix: "U" },
    { v: "Pam",      prefix: "P" },
    { v: "Andy",     prefix: "A" },
  ],

  market: [
    { v: "Mkt-US",  d: "United States" }, { v: "Mkt-UK", d: "United Kingdom" }, { v: "Mkt-AU", d: "Australia" },
    { v: "Mkt-CA",  d: "Canada" }, { v: "Mkt-DE", d: "Germany" }, { v: "Mkt-NL", d: "Netherlands" },
    { v: "Mkt-All", d: "ships to every store unchanged" },
  ],

  event: [
    "Evergreen", "Labor Day Sale", "Black Friday", "Cyber Monday", "BFCM", "Christmas", "New Year",
    "Valentines", "Presidents Day", "Easter", "Mothers Day", "Memorial Day", "Fathers Day",
    "July 4th", "Prime Day", "Summer Sale", "Grilling Season", "EOFY", "Anniversary",
    "Product Launch", "Restock", "Hiring Test",
  ],

  product: [
    "Feather", "BJORN Santoku", "LOKI", "LOKI Blackout", "LOKI Reaper", "LOKI Berserker",
    "BJORN Utility", "BJORN Chef", "ODIN 6 Boss", "ODIN 8 Boss", "ODIN Hybrid Cleaver", "ODIN Set",
    "RAGNAR Butcher", "RAGNAROK Rising Butcher", "VALHALLA Chef", "VALHALLA Butcher",
    "Tiger Cleaver", "Dragon Cleaver", "GUNNAR Cleaver", "GUNNAR Butcher", "GUNNAR Butcher XXL",
    "Rolling Sharpener", "Magnetic Holder", "Sheath", "Multi",
  ],

  // Always exactly one. There is no "everyone".
  avatar: [
    { v: "MIKE",    d: "MIKE - BBQ King" },
    { v: "JOHN",    d: "JOHN - Knife Collector" },
    { v: "STEVE",   d: "STEVE - Home Cook" },
    { v: "SARAH",   d: "SARAH - The Wife (gifter)" },
    { v: "VANCE",   d: "VANCE - The Opportunist (deal seeker)" },
    { v: "DON",     d: "DON - The Hunter" },
    { v: "COLE",    d: "COLE - The Camper / Bushcraft" },
    { v: "DANA",    d: "DANA - Knife Sharpener" },
    { v: "DARIEN",  d: "DARIEN - Proud Parents" },
  ],

  funnel: [
    { v: "Fun-TOF", d: "top of funnel: finds new people, judged on First Click ROAS" },
    { v: "Fun-MOF", d: "middle of funnel: warms people who saw us once, not yet buyers" },
    { v: "Fun-BOF", d: "bottom of funnel: closes people who already know us" },
  ],


  lp: [
    { v: "PDP",             d: "product page" },
    { v: "6r-General",      d: "6 Reasons listicle, general" },
    { v: "6r-Feather",      d: "6 Reasons, Feather" },
    { v: "6r-Blackout",     d: "6 Reasons, LOKI Blackout" },
    { v: "6r-Santoku",      d: "6 Reasons, BJORN Santoku" },
    { v: "6r-Sharpener",    d: "6 Reasons, Rolling Sharpener" },
    { v: "3r-General",      d: "3 Reasons, general" },
    { v: "7r-Blackout",     d: "7 Reasons, Blackout" },
    { v: "Collection Page", d: "collection page" },
    { v: "Offer Page",      d: "offer / promo page" },
    { v: "BYS",             d: "build your set" },
    { v: "VIP",             d: "VIP free-gift page" },
  ],

  angle: [
    { v: "Value Offer",   d: "the deal is the argument (B2G2, price, gift)" },
    { v: "Craftsmanship", d: "hand-forged, months to make, the maker's story" },
    { v: "Scarcity",      d: "stock, batch, deadline, last units" },
    { v: "Product Proof", d: "what the blade does: the cut, the weight, the grip" },
    { v: "Social Proof",  d: "reviews, customers, sold-out counts" },
    { v: "Brand Story",   d: "who we are, transparency, apology, behind the scenes" },
    { v: "Identity",      d: "the kind of person who owns this (pitmaster, collector)" },
    { v: "Collection",    d: "display, set, centerpiece, the shelf" },
    { v: "Upgrade",       d: "your old knife vs this one" },
    { v: "Gifting",       d: "buying it for someone else" },
    { v: "Objection",     d: "answers a doubt: too sharp, too pretty, too expensive" },
    { v: "Humor",         d: "the joke carries it" },
    { v: "Education",     d: "teaches something first (hack, how-to, why)" },
    { v: "Durability",    d: "outlasts, survives, heirloom" },
  ],

  hook: [
    { v: "Bold Claim",  d: "a flat statement: 'Sharpest knife you will own'" },
    { v: "Question",    d: "asks the reader something" },
    { v: "Confession",  d: "we messed up / sorry / we made too many" },
    { v: "Warning",     d: "don't buy / careful / this is not for you" },
    { v: "Number",      d: "a stat or count leads: '3 months to forge'" },
    { v: "Callout",     d: "names the reader: 'If you grill every weekend'" },
    { v: "Contrarian",  d: "says the opposite of what ads say" },
    { v: "Story",       d: "starts mid-scene: 'He hasn't touched his old set since'" },
    { v: "Command",     d: "tells them what to do: 'Keep scrolling'" },
  ],

  tone: [
    { v: "Tone-Blunt",   d: "raw, short, the real NK voice" },
    { v: "Tone-Funny",   d: "meme, joke, wink" },

    V.fields.forEach(f => { const h = document.getElementById("hint-" + f.key); if (!h) return; if (f.kind === "select") { const o = $(f.key).selectedOptions[0]; h.textContent = (o && o.dataset.d) || f.help; } else if (f.kind !== "format") h.textContent = f.help; });
    const fo = $("format") && $("format").selectedOptions[0]; const fd = document.getElementById("fmtdesc"); if (fd) { fd.innerHTML = ""; fd.append(fo ? el("b", { text: fo.value }) : el("span", { class: "hint", text: "No format picked." }), fo ? el("span", { text: fo.dataset.d || "" }) : ""); }
    if (document.getElementById("note-concept")) document.getElementById("note-concept").textContent = `${clean($("concept").value).length}/30`;
    if (document.getElementById("note-designer")) document.getElementById("note-designer").textContent = v.designer ? "prefix " + prefixOf(v.designer) : "";
    const c = v.category; document.getElementById("srcbrandwrap").classList.toggle("hidden", c !== "Adapt"); document.getElementById("srcotherwrap").classList.toggle("hidden", !(c === "Adapt" && $("sourceBrand").value === "Other"));
    const ready = !missing.length;
    const rb = document.getElementById("ratios"); rb.innerHTML = "";
    if (!isFigma && modeKey === "static") ["1x1", "9x16"].forEach(r => { const n = baseName(v) + V.delimiter + r; const box = el("div", { class: "rbox" }, el("span", { class: "rl", text: r }), el("span", { class: "rn", text: ready ? n : "fill the red menus, the " + r + " name appears here" }), el("button", { type: "button", text: "Copy " + r })); box.querySelector("button").disabled = !ready; box.querySelector("button").addEventListener("click", () => copyText(n, "Copied the " + r + " name.")); rb.appendChild(box); });
    if (modeKey === "video") { for (let n = 1; n <= hookCount(); n++) { const nm = withHook(v, n); const box = el("div", { class: "rbox" }, el("span", { class: "rl", text: "H" + n }), el("span", { class: "rn", text: ready ? nm : "fill the red menus, hook " + n + " appears here" }), el("button", { type: "button", text: "Copy H" + n })); box.querySelector("button").disabled = !ready; box.querySelector("button").addEventListener("click", () => copyText(nm, "Copied hook " + n + ".")); rb.appendChild(box); } }
    const full = modeKey === "video" ? withHook(v, 1) : baseName(v) + V.delimiter + "9x16";
    document.getElementById("fieldcount").textContent = `${V.fields.length} fields`;
    document.getElementById("charcount").textContent = `${full.length} chars`;
    if (missing.length) say("bad", isFigma ? `${missing.length} red field${missing.length === 1 ? "" : "s"} still to pick` : "Missing: " + missing.join(", "));
    if (modeKey === "static" && v.id && v.designer && !v.id.startsWith(prefixOf(v.designer))) say("warn", `ID ${v.id} does not start with ${v.designer}'s prefix ${prefixOf(v.designer)}.`);
    if (modeKey === "video" && v.id && !/^NK[A-Z0-9]*\d{3,4}$/.test(v.id)) say("warn", "Video IDs look like NK498.");
    if (v.id && pageNames.length) { const other = pageNames.find(n => n.startsWith(v.id + "_") && !n.startsWith(baseName(v)) && !selection.some(s => s.name === n)); if (other) say("warn", `ID ${v.id} is already used on this page: ${other.slice(0, 60)}...`); }
    if (v.category === "Adapt" && !v.source) say("bad", "Adaptation needs the brand it came from.");
    if (v.category === "Ite" && v.iteration === "Ite-None") say("warn", "Category is Ite but Iteration type says Ite-None.");
    if (v.category && v.category !== "Ite" && v.iteration && v.iteration !== "Ite-None") say("warn", "Iteration type is set but Category is not Ite.");
    if (v.offerRole === "Off-Headline") say("warn", "Offer as the headline breaks the house rule. Keep only if Andy asked for it.");
    if (v.offerTiming === "Off-First") say("warn", "Offer first breaks the house rule (offer lands mid or late). Keep only if the brief declares it.");
    if (v.offer === "NoOffer" && ((v.offerRole && v.offerRole !== "Off-Absent") || (v.offerTiming && v.offerTiming !== "Off-Absent"))) say("warn", "Offer is NoOffer but the offer placement says an offer is in the ad.");
    if (v.offer && v.offer !== "NoOffer" && (v.offerRole === "Off-Absent" || v.offerTiming === "Off-Absent")) say("warn", "Offer placement says absent but an offer is selected.");
    if (v.text === "Txt-Only" && v.shot && v.shot !== "Shot-None") say("warn", "Text-only ad but a product shot is selected.");
    if (v.format === "Money-Back Timeline" || v.proof === "Prf-Guarantee") say("warn", "Guarantee terms are not confirmed per market. Check before shipping.");
    if (v.product === "Feather" && v.offer && v.offer !== "NoOffer") say("warn", "Feather usually runs without a discount badge. Double-check the offer is really shown.");
    if (v.type === "UGC" && v.creator === "Cre-None") say("warn", "UGC with no creator: pick who is on camera.");
    if (v.face === "Face-Talking" && v.voice && v.voice.startsWith("Voice-AI")) say("warn", "Someone talks to camera but the voice is AI. Check.");
    if (full.length > 400) say("bad", "Name is over Meta's 400-character limit. Shorten the concept."); else if (full.length > 360) say("warn", "Name is over 360 characters. Ads Manager adds ' - Copy' on duplication; keep room under 400.");
    if (ready && !msgs.querySelector(".bad")) say("ok", isFigma ? "Ready. Select the 1x1 and 9x16 frames, then Apply." : modeKey === "video" ? "Ready. Copy each hook, or Copy all." : "Ready. Copy the 1x1 and the 9x16 name.");
    document.getElementById("applybtn").disabled = !isFigma || !ready || !!msgs.querySelector(".bad") || !selection.length;
    savePrefs(); renderSelection();
  }
  function renderSelection() {
    const box = document.getElementById("selbox");
    if (!isFigma) { box.classList.add("hidden"); return; }
    box.classList.remove("hidden");
    if (!selection.length) { box.innerHTML = '<span class="hint">Select one or more ad frames in Figma. Each gets its ratio from its own size.</span>'; return; }
    const base = baseName(values()); box.innerHTML = "";
    selection.forEach(s => { const r = ratioOf(s.w, s.h); box.appendChild(el("div", { class: "row" }, el("span", { text: `${s.w}x${s.h}` }), el("span", { text: r ? "-> " + base.slice(0, 26) + "..._" + r : "unknown ratio, will be skipped" }))); });
  }

  // ---------- parse existing names ----------
  const setSel = (name, val, table) => { const sel = $(name); if (!sel) return false; const v = table && table[val] !== undefined ? table[val] : val; if (!v) { sel.value = ""; return false; } if ([...sel.options].some(o => o.value === v)) { sel.value = v; return true; } sel.value = ""; return false; };
  function setFormat(val) { if (!$("format")) return true; fillFormats(""); if (setSel("format", val, V.alias.format)) return true; document.getElementById("fmtsearch").value = val; fillFormats(val); return false; }
  function setSource(val) { $("sourceBrand").value = ""; $("sourceOther").value = ""; if (!val || !val.startsWith("Src-")) return; const rest = val.slice(4); if (rest === "None") return; if (rest.startsWith("Other-")) { $("sourceBrand").value = "Other"; $("sourceOther").value = rest.slice(6); return; } const b = V.sourceBrands.find(b => b.replace(/\s+/g, "") === rest); if (b) $("sourceBrand").value = b; else { $("sourceBrand").value = "Other"; $("sourceOther").value = rest; } }
  function parseName(raw) {
    let s = (raw || "").trim().replace(/\.(png|jpg|jpeg|mp4|mov)$/i, "").replace(/~/g, " ").replace(/( - Copy|-1|_-1|\s\d|\(\d\)\s?\d?|_[0-9a-f]{8})+$/, "");
    if (!s) return;
    const p = s.split(V.delimiter); const notes = [];
    if (modeKey === "static") { const ratio = V.ratio.find(r => r.toLowerCase() === p[p.length - 1].toLowerCase()); if (ratio) p.pop(); }
    if (V.marker && p[1] === V.marker) p.splice(1, 1);
    const body = V.fields.filter(f => f.key !== "ratio");
    if (p.length === body.length) {
      body.forEach((f, i) => { const val = p[i];
        if (f.kind === "id") $("id").value = val; else if (f.kind === "date") $("date").value = parseDate(val) || today(); else if (f.kind === "text") $(f.key).value = val;
        else if (f.kind === "source") setSource(val); else if (f.kind === "format") { if (!setFormat(val)) notes.push("format '" + val + "' is not on the menu"); }
        else if (f.kind === "hooks") { const m = /^H(\d)$/.exec(val); if (m) $("hooks").value = m[1]; }
        else if (f.kind === "length") { const m = /^Len-(\d+)$/.exec(val); $("length").value = m ? m[1] : ""; }
        else if (!setSel(f.key, val, V.alias[f.key])) notes.push(f.label + " '" + val + "' not recognised"); });
    } else if (modeKey === "video") {
      let i = 0; $("id").value = p[i++] || ""; $("concept").value = p[i++] || "";
      const hb = /^(\d)([A-Z])$/.exec(p[i] || ""); if (hb) { $("hooks").value = hb[1]; setSel("body", hb[2]); i++; }
      if (p[i] === "Generalist" || p[i] === "Genaralist") i++;
      setSel("product", p[i++], V.alias.product); setSel("type", p[i++], V.alias.type); if (!setSel("avatar", p[i++], V.alias.avatar)) notes.push("avatar: pick the real one");
      setSel("offer", p[i++], V.alias.offer); setSel("category", p[i++], V.alias.category); setSel("strategist", p[i++]); setSel("editor", p[i++]);
      p.slice(i).forEach(x => { if (/^\d{6}$/.test(x)) $("date").value = parseDate(x) || today(); else setSel("lp", x, V.alias.lp); });
      notes.push("Old video name translated. Pick the remaining red fields.");
    } else {
      let i = 0; const hasDate = /^\d\d\.\d\d\.\d{2,4}$|^\d{8}$/.test(p[2] || "");
      $("id").value = p[i++] || ""; setSel("type", p[i++] || "IMG"); if (hasDate) $("date").value = parseDate(p[i++]) || today(); else $("date").value = today();
      $("concept").value = p[i++] || ""; const ang = p[i++] || "";
      if (V.event.includes(ang)) { $("event").value = ang; } else if (setSel("angle", ang, V.alias.angle)) { $("event").value = "Evergreen"; } else if (ang) notes.push("angle/event '" + ang + "' needs a pick");
      setSel("version", p[i++]); setSel("product", p[i++], V.alias.product);
      const fm = p[i++] || ""; if (!setFormat(fm)) notes.push("format '" + fm + "' is not on the menu, pick the closest");
      if (!setSel("avatar", p[i++], V.alias.avatar)) notes.push("avatar was 'General' or unknown: pick the real one");
      setSel("offer", p[i++], V.alias.offer); setSel("category", p[i++], V.alias.category); setSel("strategist", p[i++]); setSel("designer", p[i++]); setSel("lp", p[i++], V.alias.lp);
      notes.push("Old name translated. Pick the remaining red fields.");
    }
    render(); notes.forEach(t => say("warn", t));
  }

  // ---------- prefs ----------
  const prefKeys = () => V.fields.filter(f => f.remember).map(f => f.key);
  function savePrefs() { const o = {}; prefKeys().forEach(k => o[k] = $(k).value); o.menuUrl = $("menuUrl").value.trim(); if (isFigma) parent.postMessage({ pluginMessage: { type: "save-prefs", prefs: o } }, "*"); else { try { localStorage.setItem(prefKey(), JSON.stringify(o)); } catch (e) { } } }
  function applyPrefs(o) { if (!o) return; if (o.menuUrl && !$("menuUrl").value) $("menuUrl").value = o.menuUrl; prefKeys().forEach(k => { if (o[k] && $(k) && [...$(k).options].some(x => x.value === o[k])) $(k).value = o[k]; }); }
  function resetForm() { const mu = $("menuUrl").value; form.reset(); $("menuUrl").value = mu; $("date").value = today(); if (document.getElementById("fmtsearch")) { document.getElementById("fmtsearch").value = ""; fillFormats(""); } document.getElementById("paste").value = ""; applyPrefs(lastPrefs); if ($("designer")) $("id").value = nextId(prefixOf($("designer").value)); render(); }

  // ---------- mode switch ----------
  function mount(key) {
    modeKey = key; V = key === "video" ? NK_VOCAB_VIDEO : NK_VOCAB;
    tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.mode === key));
    buildForm();
    if (!isFigma) { try { lastPrefs = JSON.parse(localStorage.getItem(prefKey()) || "null"); } catch (e) { } applyPrefs(lastPrefs); if (MENU_URL_DEFAULT.startsWith("http")) $("menuUrl").value = MENU_URL_DEFAULT; try { localStorage.setItem("nk-name-mode", key); } catch (e) { } }
    document.getElementById("copybtn").textContent = isFigma ? "Copy name" : key === "video" ? "Copy all hooks" : "Copy both";
    render();
    if (!isFigma) loadRemote($("menuUrl").value, true);
  }
  tabs.querySelectorAll("button").forEach(b => b.addEventListener("click", () => mount(b.dataset.mode)));

  // ---------- events ----------
  form.addEventListener("input", render); form.addEventListener("change", render);
  document.getElementById("paste").addEventListener("input", () => parseName(document.getElementById("paste").value));
  document.getElementById("resetbtn").addEventListener("click", resetForm);
  document.getElementById("copybtn").addEventListener("click", () => { if (document.querySelector("#msgs .bad")) { say("warn", "Fill the red menus first."); return; } const v = values(); if (modeKey === "video") { const lines = []; for (let n = 1; n <= hookCount(); n++) lines.push(withHook(v, n)); copyText(lines.join("\n"), "Copied " + lines.length + " hook names, one per line."); } else { const b = baseName(v); copyText(isFigma ? b : b + "_1x1\n" + b + "_9x16", isFigma ? "Copied the name without ratio." : "Copied both names, one per line."); } });
  document.getElementById("applybtn").addEventListener("click", () => { const v = values(); parent.postMessage({ pluginMessage: { type: "apply", base: baseName(v), id: v.id } }, "*"); });
  document.getElementById("rescanbtn").addEventListener("click", () => { if (isFigma) parent.postMessage({ pluginMessage: { type: "rescan" } }, "*"); });
  if (!isFigma) { document.getElementById("applybtn").classList.add("hidden"); document.getElementById("rescanbtn").classList.add("hidden"); }
  else { const below = el("div", { class: "below" }); below.append(document.getElementById("selbox"), document.getElementById("msgs"), document.getElementById("paste").parentElement); document.getElementById("app").appendChild(below); }

  window.onmessage = (ev) => {
    const m = ev.data && ev.data.pluginMessage; if (!m) return;
    if (m.type === "init") { pageNames = m.pageNames || []; selection = m.selection || []; lastPrefs = m.prefs || null; applyPrefs(lastPrefs); if (!$("menuUrl").value && MENU_URL_DEFAULT.startsWith("http")) $("menuUrl").value = MENU_URL_DEFAULT; $("id").value = nextId(prefixOf($("designer").value)); render(); loadRemote($("menuUrl").value, true);
      if (selection.length === 1 && /_IMG_|_VID_|_GIF_/.test(selection[0].name)) { document.getElementById("paste").value = selection[0].name; parseName(selection[0].name); } }
    if (m.type === "selection") { selection = m.selection || []; render(); }
    if (m.type === "page") { pageNames = m.pageNames || []; render(); say("ok", `Scanned ${pageNames.length} ad frames on this page.`); }
    if (m.type === "applied") { pageNames = m.pageNames || pageNames; render(); say("ok", m.text || "Renamed."); }
    if (m.type === "error") say("bad", m.text);
  };

  // boot
  let startMode = "static";
  if (LOCK === "static" || LOCK === "video") startMode = LOCK;
  else if (!isFigma && hasVideo) { try { const q = new URLSearchParams(location.search).get("mode"); startMode = q === "video" ? "video" : (localStorage.getItem("nk-name-mode") === "video" ? "video" : "static"); } catch (e) { } }
  mount(startMode);
  if (isFigma) parent.postMessage({ pluginMessage: { type: "ready" } }, "*");
})();
</script>
